<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Socket.IO chat</title>
    <style>
      body {
        margin: 0;
        padding-bottom: 3rem;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }

      #form {
        background: rgba(0, 0, 0, 0.15);
        padding: 0.25rem;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        height: 3rem;
        box-sizing: border-box;
        backdrop-filter: blur(10px);
      }
      #input {
        border: none;
        padding: 0 1rem;
        flex-grow: 1;
        border-radius: 2rem;
        margin: 0.25rem;
      }
      #input:focus {
        outline: none;
      }
      #form > button {
        background: #333;
        border: none;
        padding: 0 1rem;
        margin: 0.25rem;
        border-radius: 3px;
        outline: none;
        color: #fff;
      }

      #messages {
        list-style-type: none;
        margin: 0;
        padding: 0;
      }
      #messages > li {
        padding: 0.5rem 1rem;
      }
      #messages > li:nth-child(odd) {
        background: #efefef;
      }
    </style>
  </head>
  <body>
    <ul id="messages"></ul>
    <form id="form" action="">
      <p id="typing_status"></p>
      <input id="input" autocomplete="off" />
      <button>Send</button>
    </form>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();

      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const messages = document.getElementById("messages");
      const typing = document.getElementById("typing_status");

      let typingTimer;

      // Send Message
      form.addEventListener("submit", (e) => {
        e.preventDefault();

        const message = input.value.trim();

        if (message) {
          socket.emit("message", message);

          input.value = "";

          socket.emit("stop_typing");
          typing.textContent = "";
        }
      });

      // Receive Message
      socket.on("send_message_to_all_users", (msg) => {
        const item = document.createElement("li");

        item.textContent = msg;

        messages.appendChild(item);
      });

      // Typing Status
      input.addEventListener("input", () => {
        if (input.value.trim()) {
          socket.emit("typing");

          clearTimeout(typingTimer);

          typingTimer = setTimeout(() => {
            socket.emit("stop_typing");
          }, 1000);
        } else {
          clearTimeout(typingTimer);
          socket.emit("stop_typing");
        }
      });

      // Show Typing
      socket.on("show_typing_status", () => {
        typing.textContent = "Client is TYPING...";
      });

      // Clear Typing
      socket.on("clear_typing_status", () => {
        typing.textContent = "";
      });
    </script>
  </body>
</html>
